# W2-E1 prompt ablation, arm v1: fixed wave-one weights, validation only (EXPERIMENT_JOURNAL W2-PLAN-003).
# The two arms differ only in format_config (system prompt); batch size, budgets, model and adapters are identical.
# Selection is deliberately not configured: score with scorer v2 (make score-v2), not the legacy selector.
format_config: configs/format_core.yaml
analysis_config: configs/analysis.yaml
output_dir: outputs
batch_size: 2  # wave-one reference; generation batching is a later, separate factor
budget:
  max_calls: 1
  max_assistant_turns: 2
  max_new_tokens: 256
  max_total_new_tokens: 512
model:
  name: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  tokenizer: Qwen/Qwen3-4B-Instruct-2507
  tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  quantization: nf4
  attn: sdpa
  compute_dtype: auto
runs:
  base: {adapter: null}
  raw_lr1e4: {adapter: checkpoints/raw_lr1e4/checkpoint-125}
  q5filtered_lr5e5: {adapter: checkpoints/q5filtered_lr5e5/checkpoint-121}
