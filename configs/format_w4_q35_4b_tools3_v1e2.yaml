# Stretch A on Qwen3.5-4B (D-105): three tools, prompt v1e2. Evaluation formatting for A-sft2-Q35 and for the zero-shot
# v1e2 arm on the Qwen3.5 relabel adapter. max_length as in format_w4_q35_4b_egfr2.yaml.
data_config: configs/data.yaml
tokenizer: Qwen/Qwen3.5-4B
tokenizer_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
chat_template_kwargs: {enable_thinking: false}
tool_call_format: xml
tools: [unit_convert, calculate_bmi, calculate_egfr]
system_prompt: configs/prompts/system_v1e2.txt
max_length: 2560
output_dir: data/sft_w4_q35_4b_tools3_v1e2
train_views: {}
eval_splits: [val]
length_report: reports/w4/token_lengths_q35_4b_tools3_v1e2.json
