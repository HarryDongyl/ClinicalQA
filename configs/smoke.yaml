# Pipeline smoke test (make smoke): tiny overfit + save/reload with Qwen3-0.6B. Never a reported result.
# Same tokenizer/template as the 4B runs (shared Qwen3 vocabulary).
extends: configs/train/raw_lr1e4.yaml
run_id: smoke
require_cuda: false
model:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  tokenizer: Qwen/Qwen3-4B-Instruct-2507
  tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  quantization: nf4
  attn: sdpa
training:
  learning_rate: 5.0e-4
  epochs: 6
  micro_batch: 1
  grad_accum: 1
  scheduler: constant
  warmup_ratio: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  gradient_checkpointing: true
  logging_steps: 1
max_examples: 8              # 2 per answer type, stratified
val_loss: false
checkpoint_dir: checkpoints/smoke
output_dir: outputs/smoke
