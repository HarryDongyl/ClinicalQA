# SFT formatting (make format). Qwen3 sizes share one tokenizer/vocabulary; the
# 4B-Instruct-2507 chat template is the single rendering contract for every run,
# including the 0.6B smoke model (D-021, D-024).
data_config: configs/data.yaml
tokenizer: Qwen/Qwen3-4B-Instruct-2507
tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
system_prompt: configs/prompts/system_v1.txt
max_length: 2048
output_dir: data/sft
# Train-only record views from `make views`; val/test are always the canonical splits.
train_views:
  raw: data/processed/raw/train.jsonl
  q5_filtered: data/processed/q5_filtered/train.jsonl
eval_splits: [val, test]
length_report: reports/token_lengths.json
