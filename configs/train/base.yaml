# Shared recipe. The data-view policy is explicit in each concrete run.
seed: 42
format_config: configs/format_core.yaml
analysis_config: configs/analysis.yaml
allow_ungrounded_targets: false
require_cuda: true
model:
  name: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  tokenizer: Qwen/Qwen3-4B-Instruct-2507
  tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  quantization: nf4
  attn: sdpa
  compute_dtype: auto
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
training:
  learning_rate: 5.0e-5
  epochs: 2
  micro_batch: 1
  grad_accum: 16
  scheduler: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  weight_decay: 0.0
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
max_examples: null
val_loss: true
