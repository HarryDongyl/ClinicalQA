# Stretch A fallback on Qwen3-4B (only if A-Q35-relabel fails its gate): three tools, prompt v1e.
format_config: configs/format_w4_q3_tools3_v1e.yaml
analysis_config: configs/analysis.yaml
output_dir: outputs
batch_size: 2  # wave-three generation batch for every matched arm (D-076); wave-two outputs (batch 4) are not reused
budget:
  max_calls: 1
  max_assistant_turns: 2
  max_new_tokens: 256
  max_total_new_tokens: 512
model:
  name: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  tokenizer: Qwen/Qwen3-4B-Instruct-2507
  tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  quantization: nf4
  attn: sdpa
  compute_dtype: auto
runs:
  base: {adapter: null}
  w3_relabel_lr1e4_s42: {adapter: checkpoints/w3_relabel_lr1e4_s42/final}  # epoch checkpoint via --adapter
  w4_q3_relabel_egfr_lr1e4: {adapter: checkpoints/w4_q3_relabel_egfr_lr1e4/final}
bootstrap:
  n: 2000
  seed: 42
