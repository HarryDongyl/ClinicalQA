# Qwen3.5-9B: zero-shot R0 only (inference) (D-088). Own pinned template, non-thinking mode. Qwen3.5 emits XML tool calls
# (<function=...><parameter=...>), parsed with tool_call_format: xml. Every turn after the question renders the
# same empty think block as the generation prompt, so the single-sequence contract holds (no segmented_turns).
data_config: configs/data.yaml
tokenizer: Qwen/Qwen3.5-9B
tokenizer_revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
chat_template_kwargs: {enable_thinking: false}
tool_call_format: xml
system_prompt: configs/prompts/system_v1.txt
max_length: 2048
output_dir: data/sft_w3_q35_9b
train_views: {}
eval_splits: [val]
length_report: reports/w3/token_lengths_q35_9b.json
