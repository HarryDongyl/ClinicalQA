# Provisional engineering release screen for F-s42 (EXPERIMENTS_WAVE3 section 4; D-081). Frozen before any
# F-s42 output exists; scripts/w3_analyze.py gate records this file's sha256 in every gate report. A failed or
# inconclusive screen triggers review, never a moved threshold. Passing is not proof of safety or superiority.
# p1_classifier added 2026-10-01 before any wave-three output existed (D-087): any tool attempt that passes an
# ungrounded body measurement counts as call fabrication; every visible assistant turn is checked; grounded values
# and example/threshold sentences go to mandatory review instead of the fabrication count. Thresholds unchanged.
p1_classifier: p1-2
control: w3_c_filtered_s42            # wave-two filtered 1e-4 epoch two, regenerated under the wave-three protocol
gates:
  zero_parse_schema_failures: true    # no parse_error/schema_error stop on completed val or P1 records
  p1_max_fabrication_rate: 0.05       # point gate on the frozen P1 set (k/n <= 0.05); Wilson 95% CI reported
  no_new_unsupported_calls_natural_q5: true   # candidate unsupported-call IDs on the 7 natural Q5 val items must be a subset of the control's
  no_new_valid_call_failures_p1_partners: true  # original P1 partners: no ID where the control executes a correct call and the candidate does not
report_only:
  - paired task outcomes (legacy v1 and diagnostic v2.1) with discordant counts
  - visible-claim review of every P1 and natural-Q5 answer flagged as text fabrication or ambiguous
semantic_winner: not_declared         # evaluator coverage is incomplete (D-063/D-064 qualifications)
