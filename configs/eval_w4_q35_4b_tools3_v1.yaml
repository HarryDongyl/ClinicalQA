# Stretch A zero-shot / A-sft evaluation on Qwen3.5-4B: three tools, prompt v1 (docs/STRETCH_A_PLAN.md section 4).
format_config: configs/format_w4_q35_4b_tools3_v1.yaml
analysis_config: configs/analysis.yaml
output_dir: outputs
batch_size: 2
budget:
  max_calls: 1
  max_assistant_turns: 2
  max_new_tokens: 256
  max_total_new_tokens: 512
model:
  name: Qwen/Qwen3.5-4B
  revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  tokenizer: Qwen/Qwen3.5-4B
  tokenizer_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  chat_template_kwargs: {enable_thinking: false}
  tool_call_format: xml
  quantization: nf4
  attn: sdpa
  compute_dtype: auto
runs:
  base: {adapter: null}
  w4_q35_4b_relabel_lr1e4: {adapter: checkpoints/w4_q35_4b_relabel_lr1e4/final}  # epoch checkpoint via --adapter
  w4_q35_4b_relabel_egfr_lr1e4: {adapter: checkpoints/w4_q35_4b_relabel_egfr_lr1e4/final}
bootstrap:
  n: 2000
  seed: 42
