# Evaluation (make eval / make final-eval). Decoding is greedy; budgets per D-023.
format_config: configs/format_core.yaml
analysis_config: configs/analysis.yaml
output_dir: outputs
batch_size: 2  # shared conservative starting point for a 24GB GPU
budget:
  max_calls: 1
  max_assistant_turns: 2
  max_new_tokens: 256
  max_total_new_tokens: 512
# Base model shared by every run; base = model + tools, no adapter.
model:
  name: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  tokenizer: Qwen/Qwen3-4B-Instruct-2507
  tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  quantization: nf4
  attn: sdpa
  compute_dtype: auto
runs:
  base: {adapter: null}
  raw_lr1e4: {adapter: checkpoints/raw_lr1e4/final}
  raw_lr5e5: {adapter: checkpoints/raw_lr5e5/final}
  q5filtered_lr5e5: {adapter: checkpoints/q5filtered_lr5e5/final}
selection:
  # Predeclared (PLAN section 6): macro of four task success rates on the Q5-grounded val subset,
  # tool component = tool end-to-end. Near ties (<= tie_margin) prefer fewer unsupported calls, then fewer
  # over-calls, then the earlier checkpoint.
  subset: q5_grounded
  tie_margin: 0.005
bootstrap:
  n: 2000
  seed: 42
