# Planning registry, not an input to clinqa.train or clinqa.evaluate.
# See EXPERIMENT_JOURNAL W2-PLAN-006, W2-RUN-007 and DECISIONS D-037 to D-052 (revision 4).
status: in_progress                          # W2-RUN-007: E1 generated; ladder at mb1
decision_split: val
test_permitted_for_decisions: false          # D-038: test consumed once in wave one
winner_permitted_this_round: false           # D-049
scorers:                                     # D-040: reported side by side; none selects
  legacy_v1: {implementation: src/clinqa/metrics.py, role: historical_and_paired_bootstrap}
  bounded_v2: {implementation: src/clinqa/scoring_v2.py, command: scripts/rescore_validation_v2.py}
  candidate_v21:
    implementation: src/clinqa/scorer_v2.py
    command: scripts/score_v21_val.py         # guarded: refuses test labels and existing outputs
    role: diagnostic_only
    known_defects: [false_pass_negative_probes, numeric_membership_check_text, no_coverage_gate, canonical_range_injection_val_085]
    test_derived_fixes_disclosed: true
  next: deterministic_checks_plus_fixed_rubric_semantic_judge  # calibrate once on val, freeze, then automatic
scoring_location: cpu_after_pod_stopped      # D-047: make w2-score
round:                                       # D-041: one bundled pod round (user decision)
  command: make w2-round
  runner: scripts/run_w2_round.sh
  batch_setup:                               # D-052 supersedes the training half of D-042 (user decision)
    train: {micro_batch: 1, grad_accum: 16, effective_batch: 16}
    superseded_train: {micro_batch: 4, grad_accum: 4, reason: slower_13.9_vs_10.0_s_per_step, opt_in: MB=mb4}
    oom_fallback: {applies_to: MB=mb4_only, micro_batch: 2, grad_accum: 8, marker: outputs/w2_mb4_oom.txt}
    generation_batch_size: 4
    confounds: [generation_batch_4_vs_wave_one_2]
  budgets_and_decoding: unchanged_from_wave_one   # D-046
  experiments:
    - id: E1
      factor: inference_system_prompt
      arms: {v1: configs/eval_w2_prompt_v1.yaml, v2: configs/eval_w2_prompt_v2.yaml}
      weights: [base, raw_lr1e4/checkpoint-125, raw_lr5e5/checkpoint-125, q5filtered_lr5e5/checkpoint-121]
      primary_arm: base                      # adapters were trained with v1
      labels: w2p_{v1,v2}_<run>
      drift_reference: [base, raw_lr1e4_step000125, raw_lr5e5_step000125, q5filtered_lr5e5_step000121]  # D-043
      decision_blocked_on: scorer_range_policy_val_085
    - id: LR
      factor: learning_rate_on_q5_filtered_view   # D-039, D-045
      prompt: v1
      arms:
        - configs/train/w2_filtered_lr1e4_mb1.yaml
        - configs/train/w2_filtered_lr1p5e4_mb1.yaml
        - configs/train/w2_filtered_lr2e4_mb1.yaml
      superseded_arms: configs/train/w2_filtered_lr{1e4,1p5e4,2e4}_{mb4,mb2}.yaml
      checkpoints: [121, 242]                 # epoch two reported separately
      skip_lr2e4_only_if: lr1p5e4_numerically_unstable   # scripts/w2_epochs.py stable
      references_same_code_state: [w2p_v1_raw_lr1e4, w2p_v1_q5filtered_lr5e5]
    - id: CROSS
      factor: prompt_v2_on_ladder
      optional: true                          # D-050: CROSS=1 make w2-round
deferred:                                    # D-048
  generation_batch_8: configs/eval_w2_bs8.yaml
  E4_q5_relabel: blocked_on_annotation_audit
  E5_pre_call_sentence_in_sft_targets: not_designed_in_code
  prompt_v2_in_training: separate_labeled_experiment
  seed_repeat: not_scheduled
  qwen3_8b: not_scheduled
cost:                                        # D-051; planning estimates, not measured
  rate_usd_per_hour: 0.74
  spent_before_round_usd: 2.97
  estimate_usd: [3.0, 3.4]
  cross_extra_usd: 0.75
  round_ceiling_usd: 5.0
  cut_order: [cross, lr2e4, stop_after_current_job]
q5_relabel:
  status: train_only_proposal_requires_annotation_audit
  proposals: reports/q5_uncertain_proposals/
  preserve_canonical_data: true
  compare_against: q5_filtered
  never_relabel_validation_or_test: true
  never_increase_tool_tolerance_from_test_observations: true
