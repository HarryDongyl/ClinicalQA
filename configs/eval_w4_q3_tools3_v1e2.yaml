  tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  quantization: nf4
  attn: sdpa
  compute_dtype: auto
runs:
  base: {adapter: null}
  w4_q3_relabel_egfr2_lr1e4: {adapter: checkpoints/w4_q3_relabel_egfr2_lr1e4/final}  # A-sft2 (D-100)
bootstrap:
  n: 2000
